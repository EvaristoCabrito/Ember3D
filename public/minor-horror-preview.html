<!doctype html><meta charset="utf-8"><title>Minor Horror</title><style>body{background:#18211e;color:#eee;font:16px system-ui;padding:28px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}article{background:#4b604c;padding:16px;border-radius:8px}img{width:100%;height:400px;object-fit:contain}button{padding:8px}small{display:block;margin:12px 0}</style><h1>Minor Horror</h1><p>36 frames per action · cropped using the supplied atlas JSON · original frame timing</p><button id="pause">Pause</button><div id="grid" class="grid"></div><small>Idle and attack use the identical sheets supplied. No death sheet was supplied; the creature uses the normal death fade.</small><script type="module">const root='/game/sprites/minor-horror-001/';const data=await(await fetch(root+'manifest.json')).json();const prefixes=['','atk-','cast-','move-'];grid.innerHTML=data.map((e,i)=>`<article><b>${e.animation}</b><img alt="${e.animation}"><span></span>${i?`<button data-sound="MinorHorror${e.animation}001.mp3">Play action sound</button>`:''}</article>`).join('');const cards=[...document.querySelectorAll('article')];let playing=true,start=performance.now(),held=0;function render(t){data.forEach((e,i)=>{const duration=e.sourceDurationsMs.reduce((a,b)=>a+b,0),clock=(t-start)%duration;let f=0,total=e.sourceDurationsMs[0];while(f<35&&clock>=total)total+=e.sourceDurationsMs[++f];const img=cards[i].querySelector('img');img.src=root+prefixes[i]+(f+1)+'.png';cards[i].querySelector('span').textContent=`Frame ${f+1}/36 · ${(duration/1000).toFixed(3)}s`;});}function tick(t){if(playing)render(t);requestAnimationFrame(tick);}requestAnimationFrame(tick);pause.onclick=()=>{playing=!playing;if(!playing)held=performance.now()-start;else start=performance.now()-held;pause.textContent=playing?'Pause':'Play';};for(const b of document.querySelectorAll('[data-sound]'))b.onclick=()=>new Audio('/game/MUSIC/SoundFX/'+b.dataset.sound).play();</script>

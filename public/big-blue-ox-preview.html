<!doctype html><meta charset="utf-8"><title>Big Blue Ox · 32-frame animations</title><style>body{background:#202921;color:#eee;font:16px system-ui;margin:30px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}article{background:#435341;padding:15px}img{width:100%;image-rendering:auto}button{padding:8px}</style><h1>Big Blue Ox</h1><p>Type 2 · two occupied hexes · 32 frames per animation · mirrored sources · AI cutouts</p><button onclick="mirrored=!mirrored">Flip facing</button> <button onclick="playing=!playing">Pause / play</button><div class="grid" id="grid"></div><script>let mirrored=false,playing=true,t=0;const names=[['Idle',''],['Walk','move-'],['Hit reaction','hit-'],['Attack','atk-'],['Death','death-'],['Special charge attack','atk2-']];grid.innerHTML=names.map(([n,p])=>`<article>${n}<img data-prefix="${p}"></article>`).join('');setInterval(()=>{if(playing)t++;for(const img of document.images){const p=img.dataset.prefix;let i=p==='death-'?Math.min(31,t%48):t%32;img.src='/game/sprites/big-blue-ox-ai-005/'+p+(i+1)+'.png';img.style.transform=mirrored?'scaleX(-1)':''}},167)</script>

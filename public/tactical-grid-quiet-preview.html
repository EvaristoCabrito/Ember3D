<!doctype html><meta charset="utf-8"><title>Quiet tactical grid</title>
<style>body{background:#161918;color:#e5e1d7;font:16px system-ui;margin:24px}.row{display:flex;gap:24px}canvas{width:480px;max-width:45vw}h1{font-size:24px}p{color:#adb2a9}</style>
<h1>Quiet tactical grid</h1><p>Ivory movement · Amber attack targets · Terrain remains visible</p>
<div class="row"><section><h2>Previous</h2><canvas id="old" width="600" height="500"></canvas></section><section><h2>Quiet v2</h2><canvas id="quiet" width="600" height="500"></canvas></section></div>
<script type="module">
import {WebGL2DRenderer} from '/src/game/gfx/WebGL2DRenderer.ts';
import {drawHexGround} from '/src/game/hexGround.ts';
import {tacticalGridStyle,tacticalGridStyleQuiet,GRID_MOVE,GRID_ENEMY_TARGET} from '/src/game/tacticalGrid.ts';
const image=new Image();image.src='/game/tiles/hex-ground-001-planicie.png';await image.decode();
function hex(ctx,x,y,r){ctx.beginPath();for(let i=0;i<6;i++){let a=(i*60-30)*Math.PI/180;let px=x+Math.cos(a)*r,py=y+Math.sin(a)*r;i?ctx.lineTo(px,py):ctx.moveTo(px,py)}ctx.closePath()}
for(const [id,style] of [['old',tacticalGridStyle],['quiet',tacticalGridStyleQuiet]]){
 const ctx=new WebGL2DRenderer(document.getElementById(id));const r=52;
 for(let y=0;y<6;y++)for(let x=0;x<7;x++){
  const cx=r*Math.sqrt(3)*(x+.5*(y&1)+.5),cy=r*(1.5*y+1);
  ctx.save();hex(ctx,cx,cy,r);ctx.clip();drawHexGround(ctx,image,cx,cy,cx,cy,r);ctx.restore();
  if(x>0&&x<6&&y>0&&y<5){const type=x>3?GRID_ENEMY_TARGET:GRID_MOVE,s=style(type);hex(ctx,cx,cy,r);ctx.fillStyle=s.fill;ctx.fill();
   if(id==='quiet'){hex(ctx,cx,cy,r*.94);ctx.strokeStyle=s.edge;ctx.lineWidth=1.3;ctx.stroke()}
  }
 }
}window.gridPreviewReady=true;
</script>

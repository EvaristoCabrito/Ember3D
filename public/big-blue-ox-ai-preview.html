<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Big Blue Ox — AI animation cuts</title>
<style>*{box-sizing:border-box}body{margin:0;background:#141a19;color:#e9efed;font:15px system-ui}main{max-width:1400px;margin:auto;padding:32px}h1{margin:0;font-size:32px}p{color:#bdccc7}button,select{background:#27352f;color:white;border:1px solid #557063;border-radius:6px;padding:9px 14px;margin:0 8px 8px 0;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:18px}article{border:1px solid #35453d;border-radius:10px;overflow:hidden}.label{padding:14px;display:flex;justify-content:space-between;gap:10px}.stage{background:#649553;height:250px;display:flex;align-items:center;justify-content:center}.stage img{width:100%;height:100%;object-fit:contain}.meta{padding:12px 14px;font-size:12px;color:#b6c7bd}.meta input{width:100%;margin-top:10px}small{color:#afc9ba}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:550px){.grid{grid-template-columns:1fr}}</style>
<main><h1>Big Blue Ox</h1><p>36 frames each · mirrored original video frames · AI backgrounds removed with U2Net · Body Type 2</p><button id="pause">Pause</button><button id="restart">Restart</button><button id="flip">Mirror facing</button><select id="background" aria-label="Preview background"><option value="#649553">Green ground</option><option value="#ffffff">White</option><option value="#17202a">Dark</option><option value="#bb407b">Magenta</option></select><small>Death uses only source 4.00–9.96 seconds and holds the final pose.</small><div class="grid" id="grid"></div></main>
<script type="module">
const root='/game/sprites/big-blue-ox-ai-006/';const manifest=await(await fetch(root+'manifest.json',{cache:'no-store'})).json();const order=['idle','move','hit','atk','death','atk2'];const names={idle:'Idle',move:'Walk',hit:'Hit reaction',atk:'Attack',death:'Death',atk2:'Bull Rush charge'};const items=order.map(name=>manifest.find(e=>e.animation===name));let playing=true,mirrored=false,start=performance.now(),pausedTime=0;
grid.innerHTML=items.map(e=>`<article><div class="label"><b>${names[e.animation]}</b><small>36 frames</small></div><div class="stage"><img alt="${names[e.animation]}" src="${root+e.frames[0].file}"></div><div class="meta"><span></span><input aria-label="${names[e.animation]} frame" type="range" min="0" max="35" value="0"></div></article>`).join('');const cards=[...document.querySelectorAll('article')];
function paint(k,i){const e=items[k],f=e.frames[i],card=cards[k],img=card.querySelector('img');if(img.dataset.frame!==String(i)){img.src=root+f.file;img.dataset.frame=i;}img.style.transform=mirrored?'scaleX(-1)':'';card.querySelector('span').textContent=e.animation==='idle'?`Frame ${i+1}/36 · 5.50s loop`:`Frame ${i+1}/36 · source ${f.seconds.toFixed(2)}s`;card.querySelector('input').value=i;}
function tick(t){if(playing){items.forEach((e,k)=>{const duration=e.animation==='idle'?5500:e.animation==='move'?2000:e.animation==='hit'?4000*75/83:4000;const step=Math.floor((t-start)/duration*36);paint(k,e.animation==='death'?Math.min(35,step):step%36);});}requestAnimationFrame(tick);}requestAnimationFrame(tick);
pause.onclick=()=>{playing=!playing;if(!playing)pausedTime=performance.now()-start;else start=performance.now()-pausedTime;pause.textContent=playing?'Pause':'Play';};restart.onclick=()=>{start=performance.now();pausedTime=0;items.forEach((e,k)=>paint(k,0));};flip.onclick=()=>{mirrored=!mirrored;cards.forEach((c,k)=>paint(k,+c.querySelector('input').value));};background.onchange=()=>document.querySelectorAll('.stage').forEach(s=>s.style.background=background.value);cards.forEach((c,k)=>c.querySelector('input').oninput=e=>{playing=false;pause.textContent='Play';pausedTime=performance.now()-start;paint(k,+e.target.value);});items.forEach((e,k)=>paint(k,0));
</script></html>
